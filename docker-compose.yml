services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASS:-local-postgres-admin-password}
      POSTGRES_DB: ${DB_NAME:-dentisys}
      DB_USER: ${DB_USER:-dentisys}
      DB_PASS: ${DB_PASS:-local-development-password}
    volumes:
      - dentisys_postgres_18_data:/var/lib/postgresql
      - ./database/init.sql:/postgres/init.sql:ro
      - ./database/apply-migrations.sh:/docker-entrypoint-initdb.d/001-migrations.sh:ro
      - ./database/migrations:/postgres/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      target: runtime
    image: ${WEB_IMAGE:-dentisys-web:local}
    ports:
      - "127.0.0.1:${BACKEND_HTTP_PORT:-8080}:80"
    environment:
      APP_ENV: development
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-dentisys}
      DB_USER: ${DB_USER:-dentisys}
      DB_PASS: ${DB_PASS:-local-development-password}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_ENCRYPTION: none
      SMTP_VERIFY_PEER: "false"
      SMTP_FROM: ${SMTP_FROM:-noreply@dentisys.local}
      ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:-bicol-u.edu.ph}
      JWT_SIGNING_KEY_B64: ${JWT_SIGNING_KEY_B64:-ZGVudGlzeXMtZGV2LWp3dC1zaWduaW5nLWtleS0zMmI=}
      MFA_ENCRYPTION_KEY_B64: ${MFA_ENCRYPTION_KEY_B64:-ZGVudGlzeXMtZGV2LW1mYS1lbmNyeXB0LWtleS0zMmI=}
      AUDIT_MAC_KEY_B64: ${AUDIT_MAC_KEY_B64:-ZGVudGlzeXMtZGV2LWF1ZGl0LW1hYy1rZXktMzJiaXQ=}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$r = @file_get_contents(\"http://127.0.0.1/healthcheck.php\"); $$j = json_decode((string) $$r, true); exit(($$j[\"status\"] ?? \"\") === \"ok\" && ($$j[\"database\"] ?? \"\") === \"up\" ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    image: ${FRONTEND_IMAGE:-dentisys-frontend:local}
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "127.0.0.1:${FRONTEND_HTTP_PORT:-5173}:5173"
    environment:
      VITE_API_PROXY_TARGET: http://web:80
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      web:
        condition: service_healthy

volumes:
  dentisys_postgres_18_data:
  frontend_node_modules:
