services:
  db:
    image: mariadb:10.4.32
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3306}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:-local-root-password}
      MARIADB_DATABASE: ${DB_NAME:-dentisys}
      MARIADB_USER: ${DB_USER:-dentisys}
      MARIADB_PASSWORD: ${DB_PASS:-local-development-password}
    volumes:
      - dentisys_db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/000-init.sql:ro
      - ./database/docker-apply-migrations.sh:/docker-entrypoint-initdb.d/001-migrations.sh:ro
      - ./database/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    ports:
      - "${BACKEND_HTTP_PORT:-8080}:80"
    environment:
      APP_ENV: development
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-dentisys}
      DB_USER: ${DB_USER:-dentisys}
      DB_PASS: ${DB_PASS:-local-development-password}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_ENCRYPTION: none
      SMTP_VERIFY_PEER: "false"
      SMTP_FROM: ${SMTP_FROM:-noreply@dentisys.local}
      ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:-bicol-u.edu.ph}
      EMAIL_OTP_HMAC_KEY_B64: ${EMAIL_OTP_HMAC_KEY_B64:-ZGVudGlzeXMtZGV2ZWxvcG1lbnQtZW1haWwtb3RwLWhtYWMta2V5LTMy}
      JWT_SIGNING_KEY_B64: ${JWT_SIGNING_KEY_B64:-ZGVudGlzeXMtZGV2LWp3dC1zaWduaW5nLWtleS0zMmI=}
      MFA_ENCRYPTION_KEY_B64: ${MFA_ENCRYPTION_KEY_B64:-ZGVudGlzeXMtZGV2LW1mYS1lbmNyeXB0LWtleS0zMmI=}
      AUDIT_MAC_KEY_B64: ${AUDIT_MAC_KEY_B64:-ZGVudGlzeXMtZGV2LWF1ZGl0LW1hYy1rZXktMzJiaXQ=}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://web:80
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      web:
        condition: service_started

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASS:-local-root-password}
    depends_on:
      db:
        condition: service_healthy

volumes:
  dentisys_db_data:
  frontend_node_modules:
