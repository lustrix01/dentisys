services:
  db:
    volumes:
      - ./tests/fixtures:/postgres/test-fixtures:ro
      - ./database/seeds:/postgres/test-seeds:ro

  web:
    environment:
      APP_ENV: test
      # EML-001: CUSTOM mode, with Mailpit standing in for the real SMTP server.
      EMAIL_PROVIDER: custom
      # Tests always use Mailpit, even when .env is set up for real email.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_ENCRYPTION: none
      SMTP_VERIFY_PEER: "false"
      SMTP_CA_FILE: ""
      DEV_MOCK_IDENTITY_ENABLED: "false"
      DEV_MOCK_BIOMETRIC_ENABLED: "false"
      DEV_MOCK_LOCATION_ENABLED: "false"
      DEV_BROWSER_ATTENDANCE_PROTOTYPE_ENABLED: "false"
      STUDENT_AUTH_ENABLED: ${STUDENT_AUTH_ENABLED:-false}
      RATE_LIMIT_STORAGE_DIR: /tmp/dentisys-ratelimit
      # EML-001: only the live-suite recipients receive Faculty notices.
      EMAIL_TEST_ALLOWLIST: "live.*@bicol-u.edu.ph"
    volumes:
      - ./tests:/var/www/html/tests:ro
      - ./database:/var/www/html/database:ro

  frontend:
    volumes:
      - ./frontend:/app:ro
      - frontend_test_node_modules:/app/node_modules

volumes:
  frontend_test_node_modules:
