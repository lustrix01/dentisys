services:
  db:
    volumes:
      - ./tests/fixtures:/postgres/test-fixtures:ro
      - ./database/seeds:/postgres/test-seeds:ro

  web:
    environment:
      APP_ENV: test
      EMAIL_PROVIDER: mailpit
      DEV_MOCK_IDENTITY_ENABLED: "false"
      DEV_MOCK_BIOMETRIC_ENABLED: "false"
      DEV_MOCK_LOCATION_ENABLED: "false"
      DEV_BROWSER_ATTENDANCE_PROTOTYPE_ENABLED: "false"
      STUDENT_AUTH_ENABLED: ${STUDENT_AUTH_ENABLED:-false}
      RATE_LIMIT_STORAGE_DIR: /tmp/dentisys-ratelimit
    volumes:
      - ./tests:/var/www/html/tests:ro
      - ./database:/var/www/html/database:ro

  frontend:
    volumes:
      - ./frontend:/app:ro
      - frontend_test_node_modules:/app/node_modules

volumes:
  frontend_test_node_modules:
