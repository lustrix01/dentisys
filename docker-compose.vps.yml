# Demo VPS overlay: use after web and database Compose files (DEL-001).
name: dentisys

services:
  traefik:
    image: traefik:v3.6.2
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.allowemptyservices=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:?Set TRAEFIK_ACME_EMAIL for certificate renewal.}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dentisys_letsencrypt:/letsencrypt
    restart: unless-stopped

  web:
    build: !reset null
    image: ${WEB_IMAGE:?Set WEB_IMAGE to the published GHCR web image.}
    deploy:
      replicas: 3
    environment:
      APP_IS_HTTPS: "true"
      APP_BASE_URL: https://${APP_DOMAIN:?Set APP_DOMAIN to the VPS hostname.}
      BIOMETRIC_SIDECAR_ENABLED: ${BIOMETRIC_SIDECAR_ENABLED:-false}
      BIOMETRIC_CHALLENGE_TTL_SECONDS: ${BIOMETRIC_CHALLENGE_TTL_SECONDS:-120}
    volumes:
      - dentisys_vps_ratelimit:/var/www/html/backend/storage/ratelimit
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.stop-signal=SIGWINCH"
      # Wait for HTTP readiness, then allow Docker health and Traefik to catch up.
      - >-
        com.centurylinklabs.watchtower.lifecycle.post-update=php -r '
        $$end = time() + 150;
        $$context = stream_context_create(["http" => ["timeout" => 2]]);
        do {
          $$body = @file_get_contents("http://127.0.0.1/healthcheck.php", false, $$context);
          $$health = json_decode((string) $$body, true);
          if (($$health["status"] ?? "") === "ok") { sleep(15); exit(0); }
          sleep(1);
        } while (time() < $$end);
        fwrite(STDERR, "Web readiness failed after 150 seconds.\n"); exit(1);'
      - "com.centurylinklabs.watchtower.lifecycle.post-update-timeout=3"
      - "traefik.enable=true"
      - "traefik.http.routers.dentisys-api.rule=Host(`${APP_DOMAIN:?Set APP_DOMAIN to the VPS hostname.}`) && (Path(`/api`) || PathPrefix(`/api/`) || Path(`/healthcheck.php`))"
      - "traefik.http.routers.dentisys-api.priority=100"
      - "traefik.http.routers.dentisys-api.entrypoints=websecure"
      - "traefik.http.routers.dentisys-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dentisys-api.service=dentisys-api"
      - "traefik.http.routers.dentisys-api.middlewares=dentisys-retry"
      - "traefik.http.middlewares.dentisys-retry.retry.attempts=3"
      - "traefik.http.middlewares.dentisys-retry.retry.initialinterval=100ms"
      - "traefik.http.services.dentisys-api.loadbalancer.server.port=80"
      - "traefik.http.services.dentisys-api.loadbalancer.healthcheck.path=/healthcheck.php"
      - "traefik.http.services.dentisys-api.loadbalancer.healthcheck.interval=5s"
      - "traefik.http.services.dentisys-api.loadbalancer.healthcheck.timeout=2s"

  frontend:
    build: !reset null
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE to the published GHCR frontend image.}
    deploy:
      replicas: 3
    ports: !reset []
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 5s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.stop-signal=SIGQUIT"
      - >-
        com.centurylinklabs.watchtower.lifecycle.post-update=end=$$(( $$(date +%s) + 150 ));
        until wget -T 2 -q -O /dev/null http://127.0.0.1/; do
          [ "$$(date +%s)" -lt "$$end" ] || { echo 'Frontend readiness failed after 150 seconds.' >&2; exit 1; };
          sleep 1;
        done; sleep 15
      - "com.centurylinklabs.watchtower.lifecycle.post-update-timeout=3"
      - "traefik.enable=true"
      - "traefik.http.routers.dentisys.rule=Host(`${APP_DOMAIN:?Set APP_DOMAIN to the VPS hostname.}`)"
      - "traefik.http.routers.dentisys.priority=10"
      - "traefik.http.routers.dentisys.entrypoints=websecure"
      - "traefik.http.routers.dentisys.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dentisys.service=dentisys"
      - "traefik.http.routers.dentisys.middlewares=dentisys-retry"
      - "traefik.http.middlewares.dentisys-retry.retry.attempts=3"
      - "traefik.http.middlewares.dentisys-retry.retry.initialinterval=100ms"
      - "traefik.http.services.dentisys.loadbalancer.server.port=80"
      - "traefik.http.services.dentisys.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.dentisys.loadbalancer.healthcheck.interval=5s"
      - "traefik.http.services.dentisys.loadbalancer.healthcheck.timeout=2s"

  biometric:
    build: !reset null
    image: ${BIOMETRIC_IMAGE:?Set BIOMETRIC_IMAGE to the published GHCR biometric image.}
    deploy:
      replicas: 1
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower:1.7.1
    environment:
      DOCKER_API_VERSION: "1.44"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
      WATCHTOWER_LIFECYCLE_HOOKS: "true"
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-300}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/dentisys/.docker/config.json:/config.json:ro
    restart: unless-stopped

  pgadmin:
    profiles: [tools]
    image: dpage/pgadmin4:9.16
    ports:
      - "127.0.0.1:${PGADMIN_HTTP_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL for pgAdmin.}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD for pgAdmin.}
      PGADMIN_DISABLE_POSTFIX: "true"
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
    volumes:
      - dentisys_vps_pgadmin_data:/var/lib/pgadmin
      - ./database/pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dentisys_letsencrypt:
  dentisys_vps_pgadmin_data:
  dentisys_vps_ratelimit:
