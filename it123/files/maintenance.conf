# DentiSYS maintenance page (used by dentisys-maintenance.sh).
# Every request gets HTTP 503 and the "temporarily unavailable" page.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/maintenance;

    location / {
        return 503;
    }

    error_page 503 /index.html;
    location = /index.html {
        internal;
        add_header Retry-After 600 always;
        add_header Cache-Control "no-store" always;
    }
}
