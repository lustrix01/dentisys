# maintenance page for nginx
# dentisys-maintenance.sh copies this into /var/lib/dentisys/maintenance
# and mounts it into a small nginx container. every request gets 503.

server {
    listen 80;
    root /usr/share/nginx/maintenance;

    location / {
        return 503;
    }

    error_page 503 /index.html;

    location = /index.html {
        internal;
    }
}
