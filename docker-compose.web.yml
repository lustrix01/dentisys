services:
  web:
    build:
      context: .
      target: runtime
    image: ${WEB_IMAGE:-dentisys-web:local}
    environment:
      APP_ENV: single-server
      EMAIL_PROVIDER: smtp
      DEV_MOCK_IDENTITY_ENABLED: "false"
      DEV_MOCK_BIOMETRIC_ENABLED: "false"
      DEV_MOCK_LOCATION_ENABLED: "false"
      DEV_BROWSER_ATTENDANCE_PROTOTYPE_ENABLED: "false"
      STUDENT_AUTH_ENABLED: ${STUDENT_AUTH_ENABLED:-false}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:-bicol-u.edu.ph}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      APP_BASE_URL: ${APP_BASE_URL:?Set APP_BASE_URL to the public HTTP(S) application URL.}
      APP_IS_HTTPS: ${APP_IS_HTTPS:-false}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-dentisys}
      DB_USER: ${DB_USER:-dentisys}
      DB_PASS: ${DB_PASS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-starttls}
      SMTP_VERIFY_PEER: ${SMTP_VERIFY_PEER:-true}
      JWT_SIGNING_KEY_B64: ${JWT_SIGNING_KEY_B64}
      MFA_ENCRYPTION_KEY_B64: ${MFA_ENCRYPTION_KEY_B64}
      AUDIT_MAC_KEY_B64: ${AUDIT_MAC_KEY_B64}
      BIOMETRIC_SIDECAR_URL: http://biometric:8000
      BIOMETRIC_SIDECAR_SHARED_SECRET: ${BIOMETRIC_SIDECAR_SHARED_SECRET:?Set BIOMETRIC_SIDECAR_SHARED_SECRET for the biometric sidecar.}
    depends_on:
      biometric:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$r = @file_get_contents(\"http://127.0.0.1/healthcheck.php\"); $$j = json_decode((string) $$r, true); exit(($$j[\"status\"] ?? \"\") === \"ok\" ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  biometric:
    build:
      context: ./biometric-sidecar
    image: ${BIOMETRIC_IMAGE:-dentisys-biometric:local}
    environment:
      BIOMETRIC_SIDECAR_SHARED_SECRET: ${BIOMETRIC_SIDECAR_SHARED_SECRET:?Set BIOMETRIC_SIDECAR_SHARED_SECRET for the biometric sidecar.}
      BIOMETRIC_STORAGE_KEY_B64: ${BIOMETRIC_STORAGE_KEY_B64:?Set BIOMETRIC_STORAGE_KEY_B64 for the biometric sidecar.}
      BIOMETRIC_HAAR_SCALE_FACTOR: ${BIOMETRIC_HAAR_SCALE_FACTOR:?Set biometric Haar calibration.}
      BIOMETRIC_HAAR_MIN_NEIGHBORS: ${BIOMETRIC_HAAR_MIN_NEIGHBORS:?Set biometric Haar calibration.}
      BIOMETRIC_HAAR_MIN_FACE_PX: ${BIOMETRIC_HAAR_MIN_FACE_PX:?Set biometric Haar calibration.}
      BIOMETRIC_QUALITY_LAPLACIAN_VARIANCE: ${BIOMETRIC_QUALITY_LAPLACIAN_VARIANCE:?Set biometric quality calibration.}
      BIOMETRIC_LBPH_RADIUS: ${BIOMETRIC_LBPH_RADIUS:?Set biometric LBPH calibration.}
      BIOMETRIC_LBPH_NEIGHBORS: ${BIOMETRIC_LBPH_NEIGHBORS:?Set biometric LBPH calibration.}
      BIOMETRIC_LBPH_GRID_X: ${BIOMETRIC_LBPH_GRID_X:?Set biometric LBPH calibration.}
      BIOMETRIC_LBPH_GRID_Y: ${BIOMETRIC_LBPH_GRID_Y:?Set biometric LBPH calibration.}
      BIOMETRIC_LBPH_THRESHOLD: ${BIOMETRIC_LBPH_THRESHOLD:?Set biometric LBPH calibration.}
      BIOMETRIC_MATCH_COUNT: ${BIOMETRIC_MATCH_COUNT:?Set biometric matching calibration.}
      BIOMETRIC_BLINK_THRESHOLD: ${BIOMETRIC_BLINK_THRESHOLD:?Set biometric liveness calibration.}
      BIOMETRIC_HEAD_TURN_RATIO: ${BIOMETRIC_HEAD_TURN_RATIO:?Set biometric liveness calibration.}
      MEDIAPIPE_FACE_LANDMARKER_MODEL_PATH: /app/models/face_landmarker.task
      BIOMETRIC_STORAGE_DIR: /var/lib/dentisys-biometric
    volumes:
      - dentisys_biometric_data:/var/lib/dentisys-biometric
      - ${MEDIAPIPE_FACE_LANDMARKER_MODEL_HOST_PATH:?Set the host path to the Face Landmarker model.}:/app/models/face_landmarker.task:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    image: ${FRONTEND_IMAGE:-dentisys-frontend:local}
    ports:
      - "${APP_HTTP_PORT:-8080}:80"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dentisys_biometric_data:
